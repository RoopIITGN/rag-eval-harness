# Acceptance thresholds for the CI gate.
#
# Set from measured baselines, not guessed. Each min sits below the observed
# value by enough to absorb the variance that metric actually carries -- see
# reports/ablation.md and reports/generation.md.
#
# CI checks the COMMITTED reports rather than re-running the pipeline, so these
# numbers only move when someone commits new results. There is no run-to-run
# noise inside CI itself, which is why there is no "fail on the second breach"
# policy here: a breach means a committed artefact got worse.

retrieval:                      # 512-recursive + hybrid, from reports/runs.jsonl
  recall_at_5:
    min: 0.90                   # measured 93.9%, bootstrap CI 90.7-96.7
    on_breach: block
  recall_at_20:
    min: 0.94                   # measured 97.2%; the reranking ceiling
    on_breach: warn             # a dip here is informative, not fatal

generation:                     # from reports/generations.jsonl
  groundedness:
    min: 0.88                   # measured 94.7% of answered queries
    on_breach: block
  answered_without_source:
    max: 0.08                   # measured 4.7% -- retrieval missed, pipeline answered
    on_breach: block            # the safety metric: an answer with no source behind it
  refusal_rate:
    max: 0.20                   # measured 11.2%; over-refusal is a failure mode too
    on_breach: warn
  gate3_rejection_rate:
    max: 0.15                   # measured 9.8% of queries had a citation rejected
    on_breach: warn             # rising means the generator is quoting less carefully

# Not thresholded:
#
#   citation validity -- every answer that survives Gate 3 has valid citations by
#   construction, so measuring it would always return 1.00.
#
#   retrieval latency -- see reports/latency.json. Not gated: it is dominated by
#   a cross-region embedding hop, so it measures the deployment rather than the
#   retrieval system, and it is not reproducible in CI without Azure access.
